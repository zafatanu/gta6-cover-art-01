<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Coast — GTA-style Cover Studio</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark">VC</span><div><h1>Velvet Coast</h1><p>GTA-style cover studio · offline</p></div></div>
  <nav class="steps" aria-label="Build steps">
    <button class="step is-active" data-step="1" type="button"><b>1</b> Add photos</button>
    <button class="step" data-step="2" type="button"><b>2</b> Layout &amp; grade</button>
    <button class="step" data-step="3" type="button"><b>3</b> Export PNG</button>
  </nav>
  <div class="top-actions">
    <button id="undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" type="button" title="Redo (Ctrl+Y)">Redo</button>
    <button id="surprise" type="button" class="accent">Surprise me</button>
  </div>
</header>
<main class="studio">
  <aside class="rail left" id="rail-photos">
    <h2>Photo library</h2>
    <p class="hint">Click a photo to put it in the selected panel. Drag on the canvas to pan, scroll to zoom, Alt-drag onto another panel to swap.</p>
    <div class="lib" id="lib"></div>
    <label class="file-btn">Add your own photo<input id="file" type="file" accept="image/*"></label>
    <h2>Panels</h2>
    <div class="panel-list" id="panel-list"></div>
  </aside>
  <section class="stage">
    <div class="stage-bar">
      <div class="tabs" id="fmt-tabs" role="tablist" aria-label="Cover size">
        <button data-fmt="1x1" type="button">1:1</button>
        <button data-fmt="4x5" type="button">4:5</button>
        <button data-fmt="16x9" class="is-active" type="button">16:9</button>
      </div>
      <label class="markers-toggle"><input id="markers" type="checkbox" checked> Face markers</label>
      <span class="gate-chip" id="gate-chip">gates…</span>
    </div>
    <div class="canvas-wrap" id="canvas-wrap"><canvas id="cover" width="1920" height="1080" aria-label="Cover preview"></canvas></div>
    <div class="layouts" id="layouts" aria-label="Layouts"></div>
  </section>
  <aside class="rail right">
    <section class="group" id="group-panel">
      <h2>Panel editor <span id="panel-name"></span></h2>
      <div class="row"><label>Zoom<input id="p-zoom" type="range" min="1" max="3" step="0.01"></label><output id="p-zoom-out"></output></div>
      <div class="row"><label>Move X<input id="p-x" type="range" min="-1" max="1" step="0.01"></label><output id="p-x-out"></output></div>
      <div class="row"><label>Move Y<input id="p-y" type="range" min="-1" max="1" step="0.01"></label><output id="p-y-out"></output></div>
      <div class="row"><label>Rotation<input id="p-rot" type="range" min="-12" max="12" step="0.5"></label><output id="p-rot-out"></output></div>
      <div class="row buttons"><button id="p-flip" type="button">Flip</button><button id="p-reset" type="button">Reset crop</button></div>
      <div class="row"><label>Role tag<input id="p-role" type="text" maxlength="24"></label></div>
      <div class="row"><label>Place<input id="p-place" type="text" maxlength="28"></label></div>
      <div class="row"><label>Time<input id="p-time" type="text" maxlength="12"></label></div>
      <div class="row"><label>Flavour<input id="p-flavor" type="text" maxlength="32"></label></div>
    </section>
    <section class="group" id="group-grade">
      <h2>Grade</h2>
      <div class="chips" id="grades"></div>
      <div class="row"><label>Strength<input id="g-strength" type="range" min="0" max="1.5" step="0.01"></label><output id="g-strength-out"></output></div>
      <div class="row"><label>Contrast<input id="g-contrast" type="range" min="0" max="0.6" step="0.01"></label><output id="g-contrast-out"></output></div>
      <div class="row"><label>Saturation<input id="g-sat" type="range" min="0" max="0.6" step="0.01"></label><output id="g-sat-out"></output></div>
      <div class="row"><label>Grain<input id="g-grain" type="range" min="0" max="0.3" step="0.01"></label><output id="g-grain-out"></output></div>
      <div class="row"><label>Vignette<input id="g-vig" type="range" min="0" max="0.8" step="0.01"></label><output id="g-vig-out"></output></div>
      <div class="row"><label>Halftone<input id="g-half" type="range" min="0" max="0.3" step="0.01"></label><output id="g-half-out"></output></div>
      <div class="row"><label>Wanted heat<input id="heat" type="range" min="1" max="5" step="1"></label><output id="heat-out"></output></div>
    </section>
    <section class="group" id="group-words">
      <h2>Words</h2>
      <div class="row"><label>Title<input id="w-title" type="text" maxlength="18"></label></div>
      <div class="row"><label>Script<input id="w-script" type="text" maxlength="24"></label></div>
      <div class="row"><label>Tagline<input id="w-tagline" type="text" maxlength="48"></label></div>
      <div class="row"><label>Press quote<input id="w-quote" type="text" maxlength="60"></label></div>
    </section>
    <section class="group" id="group-export">
      <h2>Export</h2>
      <ul class="gates" id="gates"></ul>
      <div class="export-buttons">
        <button id="ex-1x1" type="button">PNG 1080×1080</button>
        <button id="ex-4x5" type="button">PNG 1080×1350</button>
        <button id="ex-16x9" type="button">PNG 1920×1080</button>
        <button id="ex-case" type="button">Case File 1080×1350</button>
        <button id="ex-all" type="button" class="accent">Export all three + Case File</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
